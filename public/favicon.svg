<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- Profile image circle -->
  <circle cx="16" cy="16" r="14" fill="white" stroke="url(#bg)" stroke-width="2"/>
  
  <!-- Initial R -->
  <text x="16" y="21" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="url(#bg)">R</text>
  
  <!-- Decorative elements -->
  <circle cx="8" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="24" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="8" cy="24" r="1" fill="white" opacity="0.6"/>
  <circle cx="24" cy="24" r="1" fill="white" opacity="0.6"/>
</svg>